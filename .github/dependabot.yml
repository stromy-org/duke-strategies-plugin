version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
      # react + react-dom MUST bump together — react-dom@N requires react@N, so a
      # split bump opens two PRs that each fail peer-resolution. One group → one
      # resolvable PR. (No-op for plugins without React deps.)
      react:
        patterns: ["react", "react-dom"]
    ignore:
      # React 19 majors break Remotion's React 18 peer dep — these PRs can never
      # pass CI until Remotion declares React 19 support. Revisit when Remotion ships it.
      - dependency-name: "react"
        versions: ["19.x"]
      - dependency-name: "react-dom"
        versions: ["19.x"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
