# yaml-language-server: $schema=https://raw.githubusercontent.com/stromy-org/stromy-org/main/scripts/plugin-package.schema.json
# CANONICAL plugin package (ORG-PLAN-165) — the ONLY authored source of this
# plugin's identity, version, targets, skills and marketplace listing. Every
# provider manifest is generated from it: edit here, then run
#   python3 scripts/render-plugin-package.py --write --plugin <this repo>
# (from stromy-org). .copier-answers.yml is template provenance, never release state.
schema_version: 1
identity:
  name: duke-strategies
  display_name: Duke Strategies
  version: 0.5.86
  description: Plugin for Duke Strategies branded deliverables
  author:
    name: stromy-org
  repository: https://github.com/stromy-org/duke-strategies-plugin
  license: UNLICENSED
  keywords:
  - deliverables
  - branding
  - documents
  - messaging
  - press-release
targets:
- openai
- codex
- claude
- cursor
- copilot
- vscode
- kiro
- gemini
portable_capabilities:
  plugin-workflows:
    summary: Workflows authored for this plugin and shipped inside it
    skills:
    - getting-started
    - intel-guide
    - intel-ask
    - intel-brief
  dutch-government-research:
    summary: Dutch government, parliament and legislation research
    skills:
    - nl-accountability
    - nl-dossier-tracker
    - nl-eu-transposition
    - nl-evidence-grounding
    - nl-gov-data
    - nl-guide
    - nl-horizon-scan
    - nl-issue-framing
    - nl-monitor
    - nl-parliamentary-positioning
    - nl-policy-legislative-landscape
    - nl-tensions
    - nl-dossier-brief
    mcp_servers:
    - nl-gov-data
  eu-gov-data-workflows:
    summary: Workflows on the eu-gov-data MCP
    skills:
    - eu-gov-data
    - eu-guide
    - eu-file-tracker
    - eu-vote-analysis
    - eu-transposition-monitor
    - eu-horizon-scan
    - eu-influence-map
    - eu-funding-map
    mcp_servers:
    - eu-gov-data
  asset-broker-workflows:
    summary: Workflows on the asset-broker MCP
    skills:
    - asset-editor
    - asset-feedback
    - asset-guide
    - asset-workspace-setup
    mcp_servers:
    - asset-broker
  branded-deliverables:
    summary: Branded documents, decks, charts, diagrams and video rendered server-side in the client's
      brand
    skills:
    - format-prepare-document
    - format-html-hd
    - format-pptx
    - format-docx
    - format-pdf
    - format-pdf-hd
    - format-xlsx
    - format-diagram
    - format-chart
    - format-motion
    - format-video-hd
    - format-guide
    - format-i18n
    mcp_servers:
    - stromy-format
  hosted-workflows:
    summary: Hosted multi-step research and analysis workflows
    skills:
    - wf-guide
    - wf-stakeholder-analysis
    - wf-analytical-briefing
    mcp_servers:
    - stromy-workflows
  toolkit-workflows:
    summary: Workflows on the toolkit MCP
    skills:
    - kit-proposal
    - kit-prospect-contact
    - kit-guide
    mcp_servers:
    - toolkit
skills:
  include:
  - getting-started
  - nl-accountability
  - nl-dossier-tracker
  - nl-eu-transposition
  - nl-evidence-grounding
  - nl-gov-data
  - nl-guide
  - nl-horizon-scan
  - nl-issue-framing
  - nl-monitor
  - nl-parliamentary-positioning
  - nl-policy-legislative-landscape
  - nl-tensions
  - eu-gov-data
  - eu-guide
  - eu-file-tracker
  - eu-vote-analysis
  - eu-transposition-monitor
  - eu-horizon-scan
  - eu-influence-map
  - eu-funding-map
  - nl-dossier-brief
  - intel-guide
  - intel-ask
  - intel-brief
  - asset-editor
  - asset-feedback
  - format-prepare-document
  - format-html-hd
  - format-pptx
  - format-docx
  - format-pdf
  - format-pdf-hd
  - format-xlsx
  - format-diagram
  - format-chart
  - format-motion
  - format-video-hd
  - format-guide
  - format-i18n
  - asset-guide
  - asset-workspace-setup
  - wf-guide
  - wf-stakeholder-analysis
  - wf-analytical-briefing
  - kit-proposal
  - kit-prospect-contact
  - kit-guide
  provider_extras:
  - skill: format-workspace-cowork
    providers:
    - claude
    capability: cowork-workspace
    reason: Co-edits SharePoint workspace artifacts through workspace-scoped tools that exist only in
      a Cowork workspace session.
  - skill: format-workspace-memory
    providers:
    - claude
    capability: cowork-workspace
    reason: Reads and writes the client's SharePoint workspace record through workspace-scoped tools that
      exist only in a Cowork workspace session.
providers:
  claude:
    hooks: ./hooks/hooks.json
marketplace:
  name: duke-strategies-marketplace
  repository: https://github.com/stromy-org/duke-strategies-marketplace
  description: Plugin marketplace for Duke Strategies branded deliverables
  entry_description: Plugin for Duke Strategies branded deliverables
  owner:
    name: stromy-org
  entry_author:
    name: stromy-org
