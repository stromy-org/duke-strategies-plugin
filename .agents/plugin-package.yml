    skills:
    - eu-gov-data
    - eu-guide
    - eu-file-tracker
    - eu-vote-analysis
    - eu-transposition-monitor
    - eu-horizon-scan
    - eu-influence-map
    - eu-funding-map
    mcp_servers:
    - eu-gov-data
